<html lang="es"><head><meta charset="utf-8">
<style>
:root{--navy:#101943;--navy2:#1B2A6B;--cel:#A9C8FF;--oro:#E8B03A;--w:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--navy)}
body{font-family:Poppins,"Noto Color Emoji",sans-serif;color:#fff;position:relative}
#bg{position:absolute;inset:0;background:radial-gradient(1200px 900px at 50% 30%,#1f3184 0%,#101943 60%,#0a1030 100%)}
#grid{position:absolute;inset:-200px;background-image:linear-gradient(rgba(169,200,255,.05) 2px,transparent 2px),linear-gradient(90deg,rgba(169,200,255,.05) 2px,transparent 2px);background-size:90px 90px}
.dot{position:absolute;border-radius:50%;background:var(--cel);filter:blur(1px)}
#glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(232,176,58,.22),transparent 65%);left:90px;top:300px}
#bar{position:absolute;left:0;top:0;height:10px;background:var(--oro);z-index:20}
#wm{position:absolute;left:60px;top:70px;width:150px;opacity:.9;z-index:20}
#tag{position:absolute;right:60px;top:84px;z-index:20;font-weight:700;font-size:28px;letter-spacing:5px;color:var(--navy);background:var(--oro);padding:10px 26px;border-radius:40px}
.scene{position:absolute;left:70px;right:70px;top:270px;height:1040px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0}
.scene{text-shadow:0 6px 30px rgba(0,0,0,.55)}
.hl{color:var(--oro)}
.cel{color:var(--cel)}
/* hook */
.hook .t{font-size:112px;font-weight:800;line-height:1.08;letter-spacing:-2px}
.hook .w{display:inline-block;margin:0 12px}
.big-emoji{font-size:220px;line-height:1;margin-bottom:30px;filter:drop-shadow(0 20px 40px rgba(0,0,0,.35))}
/* stat */
.stat .v{font-size:250px;font-weight:800;line-height:1;color:var(--oro);letter-spacing:-6px}
.stat .l{font-size:64px;font-weight:700;margin-top:30px;line-height:1.2}
.stat .s{font-size:40px;font-weight:500;color:var(--cel);margin-top:20px}
/* bullets */
.title{font-size:72px;font-weight:800;line-height:1.12;margin-bottom:50px}
.items{width:100%;display:flex;flex-direction:column;gap:26px}
.item{display:flex;align-items:center;gap:30px;background:rgba(255,255,255,.08);border:2px solid rgba(169,200,255,.25);border-radius:32px;padding:26px 34px;text-align:left}
.item .e{font-size:92px;flex:0 0 110px;text-align:center}
.item .x{font-size:56px;font-weight:700;line-height:1.18}
/* statement */
.statement .t{font-size:86px;font-weight:800;line-height:1.14}
.statement .s{font-size:46px;font-weight:500;color:var(--cel);margin-top:34px;line-height:1.3}

.col{flex:1;border-radius:36px;padding:40px 26px;display:flex;flex-direction:column;gap:22px}

.col.b{background:var(--oro);color:var(--navy)}
.col h3{font-size:54px;font-weight:800}
.col p{font-size:40px;font-weight:600;line-height:1.2}
.vs{position:absolute;font-size:56px;font-weight:800;background:#fff;color:var(--navy);width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;left:50%;top:50%;transform:translate(-50%,-50%)}

.tl{width:100%;position:relative;padding-left:70px;text-align:left}
.tl:before{content:"";position:absolute;left:24px;top:20px;bottom:20px;width:6px;background:rgba(169,200,255,.35);border-radius:3px}
.tli{position:relative;margin:0 0 46px}
.tli:before{content:"";position:absolute;left:-62px;top:18px;width:34px;height:34px;border-radius:50%;background:var(--oro);box-shadow:0 0 0 8px rgba(232,176,58,.25)}

.tli .x{font-size:46px;font-weight:600;line-height:1.2;margin-top:6px}

.end .logo{width:420px;margin-bottom:50px}
.end .q{font-size:76px;font-weight:800;line-height:1.15}
.end .c{font-size:44px;font-weight:600;color:var(--cel);margin-top:30px;line-height:1.3}
.end .web{margin-top:60px;font-size:64px;font-weight:800;background:#fff;color:var(--navy);padding:18px 70px;border-radius:70px}

.bar{flex:1;max-width:220px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar .f{width:100%;border-radius:22px 22px 0 0;background:linear-gradient(180deg,var(--cel),#5b7fd6);transform-origin:bottom}
.bar.g .f{background:linear-gradient(180deg,#ffd27a,var(--oro))}
.bar .n{font-size:50px;font-weight:800;margin-bottom:12px}
.blab{display:flex;gap:34px;justify-content:center;width:100%;margin-top:18px}
.blab div{flex:1;max-width:220px;font-size:36px;font-weight:600;line-height:1.15}

.search{width:100%;background:#fff;color:#1d2240;border-radius:70px;padding:36px 46px;font-size:54px;font-weight:600;text-align:left;display:flex;align-items:center;gap:26px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.terminal{width:100%;background:#060a20;border:2px solid rgba(169,200,255,.3);border-radius:30px;padding:70px 40px 40px;font-family:"DejaVu Sans Mono",monospace;font-size:44px;color:#7CFFB2;text-align:left;position:relative;white-space:pre-wrap;line-height:1.35;min-height:300px}

.caret{display:inline-block;width:6px;height:1em;background:currentColor;vertical-align:-0.15em;margin-left:4px}
.typed-sub{font-size:52px;font-weight:700;margin-top:50px;line-height:1.2}

.phone{width:620px;height:1000px;border-radius:80px;border:16px solid #050816;background:linear-gradient(180deg,#26398f,#101943);position:relative;padding:120px 26px 0;display:flex;flex-direction:column;gap:22px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.phone:before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);width:200px;height:40px;border-radius:30px;background:#050816}
.nt{background:rgba(255,255,255,.92);color:#1d2240;border-radius:30px;padding:20px 22px;display:flex;gap:18px;align-items:center;text-align:left}
.nt .i{font-size:56px}.nt .a{font-size:24px;font-weight:700;color:#5a6290;text-transform:uppercase;letter-spacing:1px}.nt .x{font-size:32px;font-weight:600;line-height:1.2}
.ptitle{font-size:44px;font-weight:800;color:#fff;margin-bottom:10px}
/* fondos */
#bgs{position:absolute;inset:0;overflow:hidden;z-index:0}
.bgl{position:absolute;inset:0;opacity:0;overflow:hidden}

.flt{position:absolute;filter:drop-shadow(0 20px 30px rgba(0,0,0,.45))}
.hero{width:380px;height:380px;margin-bottom:20px;filter:drop-shadow(0 30px 50px rgba(0,0,0,.5))}

#cap{position:absolute;left:60px;right:60px;top:1350px;display:flex;justify-content:center;z-index:15}

#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:30;pointer-events:none}
#camB,#camF{position:absolute;inset:0;transform-origin:50% 42%}
#camF{z-index:5}
#vign{position:absolute;inset:0;z-index:12;pointer-events:none;background:radial-gradient(ellipse 75% 60% at 50% 45%,transparent 55%,rgba(3,6,22,.6) 100%)}
#grain{position:absolute;inset:-50px;z-index:13;pointer-events:none;opacity:.07;mix-blend-mode:overlay}
#cap .wd{display:inline-block;margin:0 15px;transform-origin:50% 60%}

.hero{perspective:900px}
.hero img{transform-style:preserve-3d}

  else if(sc.type==='bullets'){h=(sc.title?`<div class="title">${md(sc.title)}</div>`:'')+`<div class="items">${sc.items.map(it=>`<div class="item"><div class="e">${it.icon||'✅'}</div><div class="x">${md(it.text)}</div></div>`).join('')}</div>`}
  else if(sc.type==='statement'||sc.type==='emoji'){el.classList.add('statement');h=em+`<div class="t">${md(sc.text)}</div>`+(sc.sub?`<div class="s">${md(sc.sub)}</div>`:'')}
  else if(sc.type==='compare'){h=(sc.title?`<div class="title">${md(sc.title)}</div>`:'')+`<div class="cmp" style="position:relative"><div class="col a"><h3>${md(sc.left.title)}</h3>${sc.left.items.map(x=>`<p>${md(x)}</p>`).join('')}</div><div class="col b"><h3>${md(sc.right.title)}</h3>${sc.right.items.map(x=>`<p>${md(x)}</p>`).join('')}</div><div class="vs">VS</div></div>`}
  else if(sc.type==='timeline'){h=(sc.title?`<div class="title">${md(sc.title)}</div>`:'')+`<div class="tl">${sc.items.map(it=>`<div class="tli"><div class="y">${it.year}</div><div class="x">${md(it.text)}</div></div>`).join('')}</div>`}
  else if(sc.type==='end'){h=`<img class="logo" src="logo-pantera-blanco.png"><div class="q">${md(sc.text)}</div>`+(sc.sub?`<div class="c">${md(sc.sub)}</div>`:'')+`<div class="web">minksoft.co</div>`}
  else if(sc.type==='chart'){const mx=Math.max(...sc.bars.map(b=>b.value));h=(sc.title?`<div class="title">${md(sc.title)}</div>`:'')+`<div class="chartbox">${sc.bars.map(b=>`<div class="bar ${b.gold?'g':''}"><div class="n">${b.display??b.value}</div><div class="f" style="height:${Math.max(4,82*b.value/mx)}%"></div></div>`).join('')}</div><div class="blab">${sc.bars.map(b=>`<div>${md(b.label)}</div>`).join('')}</div>`+(sc.sub?`<div class="typed-sub">${md(sc.sub)}</div>`:'')}
  else if(sc.type==='type'){h=(sc.title?`<div class="title">${md(sc.title)}</div>`:'')+(sc.style==='terminal'?`<div class="terminal"><span class="tx"></span><span class="caret"></span></div>`:`<div class="search"><span>🔍</span><span><span class="tx"></span><span class="caret"></span></span></div>`)+(sc.sub?`<div class="typed-sub">${md(sc.sub)}</div>`:'')}
  else if(sc.type==='notif'){h=`<div class="phone">${sc.title?`<div class="ptitle">${md(sc.title)}</div>`:''}${sc.items.map(it=>`<div class="nt"><div class="i">${it.icon||'🔔'}</div><div><div class="a">${it.app||''}</div><div class="x">${md(it.text)}</div></div></div>`).join('')}</div>`}
  else if(sc.type==='custom'){h=sc.html}
  el.innerHTML=h;$('#stage').appendChild(el);return el;
});
function seek(t){
  const T=V.total;
  $('#bar').style.width=(100*t/T)+'%';
  $('#grid').style.transform=`translate(${(t*18)%90}px,${(t*30)%90}px)`;
  $('#glow').style.transform=`scale(${1+0.08*Math.sin(t*2)})`;
  dots.forEach((p,i)=>{p.d.style.opacity=p.o;p.d.style.transform=`translate(${p.x+Math.sin(t*0.7+i)*30}px,${(p.y-t*p.s+1920*5)%1920}px)`});
  let fl=0;
  // fondos: el de la escena actual entra con fundido sobre el anterior
  const act={};V.scenes.forEach((sc,i)=>{const k=bgOf[i];if(!k)return;const lt=t-sc.start;if(lt>=0&&lt<sc.dur+0.35){const o=lt<sc.dur?clamp(lt/0.35+(i===0?1:0)):1;act[k]=Math.max(act[k]||0,o);bgCache[k].lt=lt}});
  let z=0;Object.entries(bgCache).forEach(([k,b])=>{const o=act[k]||0;b.L.style.opacity=o;b.L.style.zIndex=(o>0&&o<1)?2:1;if(o>0)b.upd(b.lt||0,t)});
  fltEls.forEach((arr,i)=>{const sc=V.scenes[i],lt=t-sc.start;arr.forEach((im,j)=>{const on=lt>=0&&lt<sc.dur;if(!on){im.style.opacity=0;return}
    const at=0.15+j*0.18,q=eBack((lt-at)/0.55),side=parseFloat(im.style.left)<540?-1:1;const ex=clamp((lt-(sc.dur-0.25))/0.25);
    let pz=0;(sc.punch||[]).forEach(p=>{const d=t-p;if(d>=0&&d<0.6)pz+=0.18*Math.exp(-d*7)});
    im.style.opacity=clamp((lt-at)/0.15)*(1-ex)*0.97;
    im.style.transform=`translate(${side*(1-q)*320+side*ex*220}px,${Math.sin(lt*1.4+j*2)*20}px) rotate(${(1-q)*side*40+Math.sin(lt*0.9+j)*9}deg) scale(${Math.max(0,q)*(1+pz)})`;
    im.style.filter=`drop-shadow(0 20px 30px rgba(0,0,0,.45)) blur(${(1-clamp(q))*6+ex*6}px)`})});
  V.scenes.forEach((sc,i)=>{
    const el=els[i],lt=t-sc.start,on=lt>=0&&lt<sc.dur;
    el.style.opacity=on?1:0; if(!on){el.style.visibility='hidden';return} el.style.visibility='visible';
    el.style.setProperty('--p',clamp(lt/sc.dur));el.style.setProperty('--t',lt);
    const pin=i===0?1:eOut(lt/0.28), ex=clamp((lt-(sc.dur-0.2))/0.2);
    el.style.opacity=1-ex*0.9;
    el.style.transform=`translateY(${(1-pin)*70}px) scale(${(0.94+0.06*pin)*(1+0.07*ex)})`;
    el.style.filter=`blur(${(1-pin)*9+ex*10}px)`;
    if(lt<0.06&&i>0) fl=Math.max(fl,0.06*(1-lt/0.06));
    const ev=sc.events||[];
    const rev=(nodes)=>nodes.forEach((n,j)=>{const at=(ev[j]??sc.start)-sc.start;const q=eBack((lt-at)/0.35);n.style.opacity=clamp((lt-at)/0.15);n.style.transform=`translateY(${(1-q)*60}px) scale(${0.85+0.15*q})`});
    if(sc.type==='hook'){const ws=el.querySelectorAll('.w');const [a,b]=spanOf(sc);ws.forEach((w,j)=>{const at=(a-sc.start)+(b-a)*0.85*j/ws.length;const d=lt-at;const pop=d>=0&&d<0.4?Math.sin(Math.PI*d/0.4)*0.12:0;const intro=0.94+0.06*eOut(lt/0.4);w.style.opacity=1;w.style.transform=`scale(${intro+pop})`})}
    if(sc.type==='stat'){const v=el.querySelector('.v');const target=+v.dataset.v;const q=eOut((lt-0.2)/1.2);const dec=sc.decimals||0;const isYear=Number.isInteger(target)&&target>=1000&&target<=2100;const grp=sc.group!==undefined?sc.group:!isYear;const cnt=sc.count!==undefined?sc.count:!isYear;const n=(cnt?target*q:target).toLocaleString('es-CO',{minimumFractionDigits:dec,maximumFractionDigits:dec,useGrouping:grp});v.textContent=(sc.prefix||'')+n+(sc.suffix||'');v.style.transform=`scale(${0.9+0.1*eBack(lt/0.5)})`}
    if(sc.type==='bullets')rev(el.querySelectorAll('.item'));
    if(sc.type==='timeline')rev(el.querySelectorAll('.tli'));
    if(sc.type==='compare'){const c=el.querySelectorAll('.col');rev(c)}
    el.querySelectorAll('.big-emoji').forEach(b=>{b.style.transform=`translateY(${Math.sin(lt*3)*14}px) rotate(${Math.sin(lt*2)*5}deg) scale(${i===0?1:eBack(lt/0.45)})`});
    el.querySelectorAll('.hero').forEach(b=>{const ht=(sc.hero_t??sc.start)-sc.start;const q=i===0?0.82+0.18*eBack(lt/0.5):eBack((lt-ht)/0.5);const ex=clamp((lt-(sc.dur-0.22))/0.22);
      let pz=0;(sc.punch||[]).forEach(p=>{const d=t-p;if(d>=0&&d<0.6)pz+=0.1*Math.exp(-d*8)});
      b.style.opacity=(i===0?1:clamp((lt-ht)/0.12))*(1-ex);
      const im=b.querySelector('img');im.style.transform=`rotateY(${(1-clamp(q))*70+Math.sin(lt*1.3)*14}deg) rotateX(${Math.sin(lt*0.9)*6}deg)`;
      b.style.transform=`translateY(${Math.sin(lt*2.2)*14}px) scale(${Math.max(0,q)*(1+pz)*(1+0.35*ex)})`;b.style.filter=`drop-shadow(0 30px 50px rgba(0,0,0,.5)) blur(${(1-clamp(q))*10}px)`});
    if(sc.type==='end'){const l=el.querySelector('.logo');l.style.transform=`scale(${eBack(lt/0.5)})`}
    if(sc.type==='chart'){el.querySelectorAll('.bar').forEach((b,j)=>{const at=(ev[j]??sc.start+0.3)-sc.start;const q=eOut((lt-at)/0.6);b.querySelector('.f').style.transform=`scaleY(${q})`;b.querySelector('.n').style.opacity=clamp((lt-at-0.3)/0.2)})}
    if(sc.type==='type'){const tx=el.querySelector('.tx');const full=sc.text;const q=clamp((lt-0.25)/Math.max(0.6,sc.dur*(sc.typeFrac||0.55)));tx.textContent=full.slice(0,Math.round(full.length*q));el.querySelector('.caret').style.opacity=(Math.floor(lt*3)%2||q<1)?1:0;const sb=el.querySelector('.typed-sub');if(sb)sb.style.opacity=clamp((lt-0.25-sc.dur*(sc.typeFrac||0.55))/0.3)}
    if(sc.type==='notif')rev(el.querySelectorAll('.nt'));
    if(sc.onseek) (new Function('el','lt','sc',sc.onseek))(el,lt,sc);
  });
  $('#flash').style.opacity=fl;
  // cámara: movimiento por plano, golpes en palabras clave, pulso de mano y sacudida del hook
  let ci=V.scenes.findIndex(sc=>t>=sc.start&&t<sc.start+sc.dur);if(ci<0)ci=V.scenes.length-1;
  const cs_=V.scenes[ci],clt=t-cs_.start,cp=clamp(clt/cs_.dur),mv=cs_.move||MOVES[ci%MOVES.length];
  let S=1,X=0,Y=0;
  if(mv==='push')S=1+0.07*cp;else if(mv==='pull')S=1.08-0.07*cp;else if(mv==='panL'){S=1.05;X=40-80*cp}else if(mv==='panR'){S=1.05;X=-40+80*cp}else if(mv==='tilt'){S=1.05;Y=35-70*cp}
  if(ci>0){const e=1-eOut(clt/0.35);S+=0.06*e}
  let pz=0;V.scenes.forEach(sc=>(sc.punch||[]).forEach(p=>{const d=t-p;if(d>=0&&d<0.7)pz+=0.045*(1-Math.exp(-d*30))*Math.exp(-d*5)}));S+=pz;
  X+=3*Math.sin(t*1.3)+2*Math.sin(t*2.7);Y+=3*Math.sin(t*1.1+1);let Rz=0.18*Math.sin(t*0.8);
  if(t<0.35){const a=(1-t/0.35);X+=a*14*Math.sin(t*95);Y+=a*10*Math.cos(t*80);S+=a*0.05}
  $('#camF').style.transform=`translate(${X}px,${Y}px) scale(${S}) rotate(${Rz}deg)`;
  $('#camB').style.transform=`translate(${X*0.5}px,${Y*0.5}px) scale(${1+(S-1)*0.6+0.03}) rotate(${Rz*0.5}deg)`;
  $('#bgs').style.filter='blur(1.5px)';
  const late=clamp((t-2.8)/0.5);$('#wm').style.opacity=0.9*late;$('#tag').style.opacity=late;
  $('#grain').style.transform=`translate(${-((t*997)%50)}px,${-((t*631)%50)}px)`;
  // subtítulos karaoke: bloque de 2-3 palabras, palabra activa resaltada, palabras clave en dorado
  let cur=null;for(const sc of V.scenes)for(const c of (sc.chunks||[]))if(t>=c.t-0.05&&t<c.t+c.d+0.12)cur=c;
  const cs=$('#cs');
  if(cur&&V.meta.captions!==false){
    if(cs.dataset.k!==String(cur.t)){cs.innerHTML=cur.words.map(w=>`<span class="wd${w.k?' k':''}">${w.w}</span>`).join('');cs.dataset.k=String(cur.t)}
    const q=eBack((t-cur.t+0.05)/0.2);cs.style.opacity=1;cs.style.transform=`scale(${0.88+0.12*q})`;
    cs.querySelectorAll('.wd').forEach((n,j)=>{const w=cur.words[j];const on=t>=w.t&&t<w.t+w.d+0.05;n.classList.toggle('on',on);n.style.transform=on?'scale(1.06) translateY(-3px)':'scale(1)'});
  } else cs.style.opacity=0;
}
window.seek=seek;seek(0);
